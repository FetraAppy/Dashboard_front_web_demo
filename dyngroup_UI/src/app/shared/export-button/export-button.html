<button
  type="button"
  class="export-btn"
  (click)="export()"
  [disabled]="loading"
  [attr.aria-busy]="loading"
  [title]="loading ? 'Export en cours…' : 'Exporter en Excel (avec les filtres actifs)'"
  [attr.aria-label]="loading ? 'Export en cours' : 'Exporter en Excel'"
>
  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M12 3v12" />
    <path d="m7 10 5 5 5-5" />
    <path d="M5 21h14" />
  </svg>
</button>
